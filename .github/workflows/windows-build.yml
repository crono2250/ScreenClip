name: Build Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run smoke tests
        shell: pwsh
        run: ./tests/run.ps1

      - name: Build 64-bit app
        shell: pwsh
        run: ./build.ps1

      - name: Package release and update manifest
        shell: pwsh
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          ./package.ps1 -Commit $env:BUILD_COMMIT -ReleaseTag "build-$env:BUILD_COMMIT-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

      - name: Publish build artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ScreenClip-windows-x64
          path: |
            dist/ScreenClip.exe
            dist/ScreenClip.exe.config
            dist/SHA256SUMS
            dist/ScreenClip-windows-x64.zip
            dist/update.json
          if-no-files-found: error
          retention-days: 30

      - name: Show artifact link
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
            '### ScreenClip Windows x64'
            "- Commit: $env:GITHUB_SHA"
            "- Artifact: [ScreenClip-windows-x64]($env:ARTIFACT_URL)"
            '- Contents: ScreenClip.exe, ScreenClip.exe.config, SHA256SUMS, ScreenClip-windows-x64.zip, update.json'
          )

  publish:
    needs: build
    if: github.repository == 'crono2250/ScreenClip' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: screenclip-release
      cancel-in-progress: false
    steps:
      - name: Check out publishing script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download tested build
        uses: actions/download-artifact@v8
        with:
          name: ScreenClip-windows-x64
          path: dist

      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./publish.ps1
